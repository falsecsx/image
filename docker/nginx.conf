server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.html index.php;

    charset utf-8;
    client_max_body_size 64m;

    # Long-running API proxy timeouts
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 65s;

    # Never serve runtime data, caches, local config, or VCS internals
    location ^~ /cache/ { return 404; }
    location ^~ /tmp/ { return 404; }
    location ^~ /.git/ { return 404; }
    location ~* ^/data/(auth\.db|auth\.db-.*|community-prompts-blacklist\.json|community-prompts-sync-report\.json) { return 404; }
    location = /php-dev.ini { return 404; }
    location = /.htaccess { return 404; }
    location = /dev-router.php { return 404; }

    # API + cloud image routing (mirrors dev-router.php)
    location ~ ^/api/auth/(?!router\.php$)(.*)$ { rewrite ^/api/auth/(.*)$ /api/auth/router.php?action=$1 last; }
    location ~ ^/api/membership/(?!router\.php$)(.*)$ { rewrite ^/api/membership/(.*)$ /api/membership/router.php?action=$1 last; }
    location ~ ^/api/quota/(?!router\.php$)(.*)$ { rewrite ^/api/quota/(.*)$ /api/quota/router.php?action=$1 last; }
    location ~ ^/api/cloud/(?!router\.php$|serve\.php$)(.*)$ { rewrite ^/api/cloud/(.*)$ /api/cloud/router.php?action=$1 last; }
    location ~ ^/cloud-images/(.+)$ { rewrite ^/cloud-images/(.+)$ /api/cloud/serve.php?file=$1 last; }
    location = /admin { rewrite ^ /admin.php last; }

    # Static asset caching
    location ~* \.(css|js|json|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # index.html - no cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PHP proxy
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_connect_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
